name: CI Check

# (03/11/2026) Kiểm tra nhanh MỖI LẦN bạn push code lên main, để lỗi cú pháp / YAML hỏng được báo ngay
# (run đỏ + GitHub thường gửi email) thay vì làm đứt chuỗi Generate Playlists mà không ai biết.
# Gồm 3 việc (~1-2 phút):
#   1) Bundle bộ tạo playlist bằng esbuild (đúng bước Generate dùng) + kiểm tra cú pháp file bundle.
#   2) node --check cho scripts/*.mjs.
#   3) scripts/validate-repo.mjs: YAML của mọi workflow (thiếu `on:`/`jobs:`, cron sai), JSON cấu hình, data/auto-rerun.txt.
# Workflow này ĐỘC LẬP: KHÔNG hủy / KHÔNG chạy lại Generate Playlists, và lỗi ở đây KHÔNG chặn Generate chạy.
# Không build giao diện Next.js vì dự án không deploy web (chỉ chạy bộ tạo playlist trên GitHub Actions).
# Chạy tay được: tab Actions > CI Check > Run workflow.
on:
  push:
    branches:
      - main
    paths-ignore: # các file do bot tự ghi - không cần kiểm tra
      - 'public/playlists/**'
      - 'data/source-domains.hash'
      - 'data/source-domains.txt'
      - 'data/source-domains.json'
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true # push mới -> bỏ lần kiểm tra cũ (chỉ ảnh hưởng chính workflow này)

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle bộ tạo playlist (esbuild) + kiểm tra cú pháp
        run: |
          npm run generate-playlists:standalone:build
          node --check .generate-playlists-standalone.cjs

      - name: Kiểm tra cú pháp scripts/*.mjs
        if: ${{ !cancelled() }}
        run: |
          for f in scripts/*.mjs; do
            node --check "$f" && echo "OK   $f"
          done

      - name: Kiểm tra workflow YAML + JSON cấu hình
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --no-audit --no-fund js-yaml@4.1.0
          node scripts/validate-repo.mjs
