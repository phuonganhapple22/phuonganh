# DON DEP LICH SU COMMIT HANG NGAY (09/10/2026): gop TOAN BO lich su nhanh chinh thanh 1 commit
# duy nhat chua trang thai hien tai (file + noi dung giu nguyen, link raw khong doi), roi force push.
# Muc dich: repo khong phinh dan theo thoi gian. Chay 02:30 sang moi ngay (gio VN) hoac bam tay.
#
# Thu tu (de khong tranh nhau voi job vong lap Generate Playlists):
#   1) Huy job Generate Playlists dang chay  2) Gop lich su + force push  3) Chay lai Generate Playlists.
# LUU Y: force push se bi chan neu nhanh chinh bat "branch protection". Mat lich su sua code cu.
name: Daily Squash History

on:
  # (10/10/2026) TAT lich tu dong: bot khong con commit vao main (playlist da sang nhanh `playlists`
  # luon 1 commit), nen khong con gi can gop moi ngay - va gop se XOA LICH SU CODE cua ban. Chi chay khi
  # bam tay. Muon bat lai tu dong thi them lai:  schedule: [{ cron: '30 19 * * *' }]
  workflow_dispatch:

concurrency:
  group: squash-history
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # 1) HUY job Generate Playlists TRUOC (chua checkout) de khong con ai push xen vao luc gop.
      - name: Huy job Generate Playlists dang chay (tranh push xen vao luc gop)
        run: |
          for st in in_progress queued pending; do
            for id in $(gh run list --workflow validate-and-generate.yml --status "$st" --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
              echo "Huy run $id ($st)"
              gh run cancel "$id" || true
            done
          done
          sleep 15 # cho lenh push dang do cua job vua huy (neu co) ket thuc han

      # 2) Checkout SAU khi da huy -> lay dung ban moi nhat, gom ca commit cuoi cua job vua huy.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # 3) Gop + force push CO KHOA: --force-with-lease chi ghi de neu nhanh van dung o ban vua gop.
      #    Neu giua chung co ai push (vd ban up code, workflow Check Domains) -> bi tu choi,
      #    tai lay ban moi nhat roi gop lai (toi da 3 lan) -> KHONG bao gio xoa nham commit cua nguoi khac.
      - name: Gop lich su thanh 1 commit va force push (co khoa)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3; do
            git fetch -q --depth 1 origin "${BRANCH}"
            SHA=$(git rev-parse FETCH_HEAD)
            git checkout -q -f --detach FETCH_HEAD
            git checkout -q --orphan "squashed$i"
            git add -A
            git commit -q -m "Daily history squash $(date -u +%Y-%m-%d)"
            if git push --force-with-lease="${BRANCH}:${SHA}" origin "squashed$i:${BRANCH}"; then
              ok=1; break
            fi
            echo "Nhanh ${BRANCH} vua co commit moi (lan $i) - lay ban moi nhat va gop lai."
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::Khong gop duoc sau 3 lan (nhanh lien tuc bi push) - se thu lai lan chay sau."; exit 1; }
          echo "Da gop lich su nhanh ${BRANCH} thanh 1 commit."

      # 4) LUON chay lai Generate Playlists (ke ca khi buoc gop that bai), vi o buoc 1 da huy no.
      - name: Chay lai Generate Playlists
        if: ${{ always() }}
        run: |
          for i in 1 2 3; do
            if gh workflow run validate-and-generate.yml --ref "${BRANCH}"; then exit 0; fi
            sleep $((i * 3))
          done
          echo "::error::Khong goi duoc workflow_dispatch"; exit 1
